name: Bug report
description: Something in AceMate doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems:** please don't open an issue. Use the *Security* tab, then *Report a vulnerability*.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AceMate version
      description: Shown in the page footer, and at `/healthz`.
      placeholder: "27.0.1"
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Docker image
        - Built binary (make build)
        - make dev
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AI model and provider
      description: For example "claude-haiku-5-5", or "a model on OpenRouter". Never paste an API key.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on macOS, Safari on iPhone ...
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: Relevant lines from the server output (`docker compose logs app`).
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed API keys, passwords, and any personal data (resume contents, email addresses) from this report.
          required: true
